name: FastfetchWidget
options:
  bundleIdPrefix: com.redwanh.fastfetchwidget
  deploymentTarget:
    macOS: "14.0"

targets:
  FastfetchWidgetHost:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redwanh.fastfetchwidget
        PRODUCT_NAME: FastfetchWidgetHost
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    entitlements:
      path: App/FastfetchWidgetHost.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - target: FastfetchWidgetExtension
        embed: true

  FastfetchWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redwanh.fastfetchwidget.widget
        PRODUCT_NAME: FastfetchWidgetExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    entitlements:
      path: Widget/FastfetchWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
